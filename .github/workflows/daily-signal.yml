name: Daily UC Signal

# Cron is in UTC.
#   22:00 UTC Mon-Fri = ~06:00 next-day Beijing time, ~1h after NYSE close
#   This ensures the US-session data (DXY, VIX, ^TNX, GC, BTC, etc.) used
#   by the signal pipeline is fully settled before we compute.
on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:        # allow manual trigger from the Actions tab

# The job pushes the regenerated signal artefacts back into the repository,
# so it needs write access to repository contents.
permissions:
  contents: write

concurrency:
  group: daily-signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate today's signal
        run: python scripts/daily_signal.py

      - name: Update paper-trading PnL
        run: python scripts/update_paper_pnl.py

      - name: Show latest signal
        run: |
          echo "::group::Latest signal"
          cat signals/latest.json
          echo "::endgroup::"
          echo "::group::REPORT.md (head)"
          head -40 signals/REPORT.md
          echo "::endgroup::"

      - name: Commit and push
        env:
          RUN_DATE: ${{ github.run_id }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signals/
          if git diff --cached --quiet; then
            echo "No signal updates to commit."
          else
            git commit -m "daily signal: $(date -u +%Y-%m-%d)"
            git push
          fi
